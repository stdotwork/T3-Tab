<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>T3-Tab microphone</title>
    <style>
      :root { color-scheme: light dark; --bg: #ffffff; --fg: #1a1a1a; --muted: #6b6b6b; --line: #e3e3e3; --action: #1a1a1a; --action-fg: #ffffff; }
      @media (prefers-color-scheme: dark) { :root { --bg: #161616; --fg: #ededed; --muted: #9a9a9a; --line: #2c2c2c; --action: #ededed; --action-fg: #161616; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
      main { max-width: 420px; padding: 24px; text-align: center; }
      h1 { font-size: 20px; font-weight: 500; margin: 0 0 8px; }
      p { margin: 0 0 16px; color: var(--muted); }
      button { font: inherit; padding: 8px 16px; border: 0; border-radius: 999px; background: var(--action); color: var(--action-fg); cursor: pointer; }
      button[hidden] { display: none; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Allow the microphone for T3-Tab</h1>
      <p id="detail">The side panel records your voice for dictation, and T3 Code turns it into text on this machine. The browser asks here because a side panel cannot ask.</p>
      <button id="again" type="button">Allow microphone</button>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
